<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><rect width="1200" height="900" fill="#1f2326"/><rect x="200" y="60" width="800" height="780" fill="#e8dcc4"/><path d="M1000 60 L1000 840 L960 800 L985 740 L950 680 L990 620 L955 560 L995 500 L960 440 L990 380 L955 320 L990 260 L960 200 L995 140 L965 60 Z" fill="#1f2326"/><text x="240" y="120" font-family="Courier New, monospace" font-size="26" font-weight="bold" fill="#2a241c">TORN FINANCIAL DOCUMENT</text><text x="240" y="190" font-family="Courier New, monospace" font-style="normal" font-size="26" fill="#2f2a22">Pacific Crest Savings &amp; Loan, account ending 4471,</text><text x="240" y="234" font-family="Courier New, monospace" font-style="normal" font-size="26" fill="#2f2a22">statement for April 1985. Three withdrawals by</text><text x="240" y="278" font-family="Courier New, monospace" font-style="normal" font-size="26" fill="#2f2a22">cheque, each payable to 'D. Mercer Mgmt', total</text><text x="240" y="322" font-family="Courier New, monospace" font-style="normal" font-size="26" fill="#2f2a22">$18,400. Eleanor has circled them and written in the</text><text x="240" y="366" font-family="Courier New, monospace" font-style="normal" font-size="26" fill="#2f2a22">margin: 'Not authorised. Who signed?'</text><rect x="40" y="790" width="300" height="70" fill="#d9cfb8"/><text x="60" y="836" font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#2a241c">E15</text><text x="140" y="836" font-family="Courier New, monospace" font-size="18" fill="#2a241c">C001 EVIDENCE</text><text x="1180" y="30" text-anchor="end" font-family="Courier New, monospace" font-size="16" fill="#fff" opacity="0.35">PLACEHOLDER</text></svg>