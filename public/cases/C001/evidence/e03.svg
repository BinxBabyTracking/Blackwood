<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"><rect width="1200" height="900" fill="#1f2326"/><rect x="200" y="60" width="800" height="780" fill="#e8dcc4"/><line x1="230" y1="150" x2="970" y2="150" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="184" x2="970" y2="184" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="218" x2="970" y2="218" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="252" x2="970" y2="252" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="286" x2="970" y2="286" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="320" x2="970" y2="320" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="354" x2="970" y2="354" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="388" x2="970" y2="388" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="422" x2="970" y2="422" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="456" x2="970" y2="456" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="490" x2="970" y2="490" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="524" x2="970" y2="524" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="558" x2="970" y2="558" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="592" x2="970" y2="592" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="626" x2="970" y2="626" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="660" x2="970" y2="660" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="694" x2="970" y2="694" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="728" x2="970" y2="728" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="762" x2="970" y2="762" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><line x1="230" y1="796" x2="970" y2="796" stroke="#8fb0c7" stroke-width="1.5" opacity="0.6"/><text x="240" y="120" font-family="Courier New, monospace" font-size="26" font-weight="bold" fill="#2a241c">FINANCIAL LEDGER DISCREPANCY</text><text x="240" y="190" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#2f2a22">Monthly entries since 1981 in Eleanor's neat hand.</text><text x="240" y="234" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#2f2a22">Each month she records the estate income Daniel</text><text x="240" y="278" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#2f2a22">Mercer reported to her. Against the last fourteen</text><text x="240" y="322" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#2f2a22">months she has pencilled a second column, headed</text><text x="240" y="366" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#2f2a22">'Bank says', and the two columns drift apart by</text><text x="240" y="410" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#2f2a22">thousands. At the bottom of the page: 'Ask P. to</text><text x="240" y="454" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#2f2a22">pull statements.'</text><rect x="40" y="790" width="300" height="70" fill="#d9cfb8"/><text x="60" y="836" font-family="Courier New, monospace" font-size="28" font-weight="bold" fill="#2a241c">E03</text><text x="140" y="836" font-family="Courier New, monospace" font-size="18" fill="#2a241c">C001 EVIDENCE</text><text x="1180" y="30" text-anchor="end" font-family="Courier New, monospace" font-size="16" fill="#fff" opacity="0.35">PLACEHOLDER</text></svg>